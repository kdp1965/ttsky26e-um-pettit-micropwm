<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<defs>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="1.1" fill="#0f2a1a"/>
  </pattern>
  <radialGradient id="vig" cx="26%" cy="50%" r="70%">
    <stop offset="0" stop-color="#062414" stop-opacity=".95"/>
    <stop offset=".45" stop-color="#020c07" stop-opacity=".6"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000"/></linearGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-420" y="-420" width="840" height="840">
    <feGaussianBlur stdDeviation="26" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" filterUnits="userSpaceOnUse" x="-420" y="-420" width="840" height="840"><feGaussianBlur stdDeviation="5"/></filter>
  <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#5dff7a"/><stop offset="1" stop-color="#19e6c1"/></linearGradient>
  <style>
    .off{fill:#07130c;stroke:#12301d;stroke-width:1.5}
    .mono{font-family:Menlo,'SF Mono',Monaco,monospace}
    .seglbl{font-family:Menlo,monospace;font-size:17px;font-weight:bold}
    .trace{fill:none;stroke:#0f3a22;stroke-width:2}
  </style>
</defs>
<rect width="1280" height="640" fill="#000"/>
<rect width="1280" height="640" fill="url(#dots)"/>
<rect width="1280" height="640" fill="url(#vig)"/>

<!-- PCB traces from the display toward the title -->
<g class="trace">
  <path d="M500 196 H560 L584 172 H1240"/>
  <path d="M500 560 H600 L622 538 H1240" />
  <path d="M96 300 H60 V600 H520 L540 580"/>
  <path d="M96 240 H40 V60 H420 L440 80" />
</g>
<g fill="#000" stroke="#1c6a3c" stroke-width="2">
  <circle cx="1240" cy="172" r="5"/><circle cx="1240" cy="538" r="5"/><circle cx="540" cy="580" r="5"/><circle cx="440" cy="80" r="5"/>
</g>

<!-- display package -->
<rect x="96" y="56" width="404" height="528" rx="22" fill="#020704" stroke="#16402a" stroke-width="2"/>
<rect x="106" y="66" width="384" height="508" rx="15" fill="none" stroke="#0b2014" stroke-width="1"/>
<g fill="#16402a">
  <rect x="150" y="584" width="14" height="16" rx="2"/><rect x="150" y="40" width="14" height="16" rx="2"/><rect x="216" y="584" width="14" height="16" rx="2"/><rect x="216" y="40" width="14" height="16" rx="2"/><rect x="282" y="584" width="14" height="16" rx="2"/><rect x="282" y="40" width="14" height="16" rx="2"/><rect x="348" y="584" width="14" height="16" rx="2"/><rect x="348" y="40" width="14" height="16" rx="2"/><rect x="414" y="584" width="14" height="16" rx="2"/><rect x="414" y="40" width="14" height="16" rx="2"/>
</g>

<g transform="translate(298,320) skewX(-7)">
  <polygon class="off" transform="translate(0,-186)" points="-88.0,0.0 -67.0,-21.0 67.0,-21.0 88.0,0.0 67.0,21.0 -67.0,21.0" />
<polygon class="off" transform="translate(0,186)" points="-88.0,0.0 -67.0,-21.0 67.0,-21.0 88.0,0.0 67.0,21.0 -67.0,21.0" />
<polygon class="off" transform="translate(-93.0,-93.0)" points="0.0,-88.0 -21.0,-67.0 -21.0,67.0 0.0,88.0 21.0,67.0 21.0,-67.0" />
<polygon class="off" transform="translate(93.0,93.0)" points="0.0,-88.0 -21.0,-67.0 -21.0,67.0 0.0,88.0 21.0,67.0 21.0,-67.0" />
  <text x="0" y="-180" text-anchor="middle" class="seglbl" fill="#1f5a33">a</text>
<text x="0" y="192" text-anchor="middle" class="seglbl" fill="#1f5a33">d</text>
<text x="-93.0" y="-87.0" text-anchor="middle" class="seglbl" fill="#1f5a33">f</text>
<text x="93.0" y="99.0" text-anchor="middle" class="seglbl" fill="#1f5a33">c</text>
  <!-- tail -->
  <g filter="url(#glow)" opacity=".42"><polygon class="" transform="translate(-93.0,93.0)" points="0.0,-88.0 -21.0,-67.0 -21.0,67.0 0.0,88.0 21.0,67.0 21.0,-67.0" fill="#19c95a"/></g>
  <!-- body -->
  <g filter="url(#glow)" opacity=".8"><polygon class="" transform="translate(0,0)" points="-88.0,0.0 -67.0,-21.0 67.0,-21.0 88.0,0.0 67.0,21.0 -67.0,21.0" fill="#2bf06a"/></g>
  <!-- head -->
  <g filter="url(#glow)"><polygon class="" transform="translate(93.0,-93.0)" points="0.0,-88.0 -21.0,-67.0 -21.0,67.0 0.0,88.0 21.0,67.0 21.0,-67.0" fill="#7dff8f"/></g>
  <polygon transform="translate(93.0,-93.0) scale(.62,.86)" points="0.0,-88.0 -21.0,-67.0 -21.0,67.0 0.0,88.0 21.0,67.0 21.0,-67.0" fill="#eafff0" opacity=".85" filter="url(#soft)"/>
  <!-- snake eyes on the head, travelling up -->
  <circle cx="85.0" cy="-145.0" r="3.6" fill="#03200f"/>
  <circle cx="101.0" cy="-145.0" r="3.6" fill="#03200f"/>
  <!-- decimal point -->
  <circle cx="137.0" cy="188" r="13" class="off"/>
</g>

<!-- callouts -->
<g class="mono" font-size="15" font-weight="bold" letter-spacing="2">
  <text x="474" y="150" fill="#9dffb0" text-anchor="end">HEAD</text>
  <text x="300" y="296" fill="#35d96b" text-anchor="middle">BODY</text>
  <text x="128" y="500" fill="#1c8f47">TAIL</text>
</g>

<!-- text block -->
<g class="mono">
  <text x="584" y="140" font-size="19" font-weight="bold" letter-spacing="5" fill="#35d96b">TINY TAPEOUT · SKY26e · MICRO TILE</text>
  <text x="578" y="282" font-size="102" font-weight="bold" letter-spacing="-3"><tspan fill="#f2fff5">Micro</tspan><tspan fill="url(#title)">Snake</tspan></text>
  <rect x="584" y="312" width="72" height="5" fill="#2bf06a"/>
  <text x="584" y="372" font-size="25" fill="#b9c9be">A 3-segment snake slithering around</text>
  <text x="584" y="408" font-size="25" fill="#b9c9be">a 7-segment display, steered by an LFSR.</text>

  <text x="584" y="476" font-size="17" font-weight="bold" letter-spacing="3" fill="#1c8f47">LFSR</text>
  <text x="650" y="476" font-size="17" letter-spacing="6.5" fill="#5dff7a"><tspan fill-opacity="0.15">1</tspan><tspan fill-opacity="0.15">0</tspan><tspan fill-opacity="0.16">1</tspan><tspan fill-opacity="0.17">0</tspan><tspan fill-opacity="0.18">0</tspan><tspan fill-opacity="0.19">0</tspan><tspan fill-opacity="0.21">1</tspan><tspan fill-opacity="0.22">0</tspan><tspan fill-opacity="0.24">0</tspan><tspan fill-opacity="0.26">0</tspan><tspan fill-opacity="0.28">0</tspan><tspan fill-opacity="0.30">1</tspan><tspan fill-opacity="0.32">1</tspan><tspan fill-opacity="0.34">0</tspan><tspan fill-opacity="0.37">0</tspan><tspan fill-opacity="0.39">0</tspan><tspan fill-opacity="0.42">1</tspan><tspan fill-opacity="0.44">0</tspan><tspan fill-opacity="0.47">0</tspan><tspan fill-opacity="0.50">0</tspan><tspan fill-opacity="0.53">0</tspan><tspan fill-opacity="0.56">1</tspan><tspan fill-opacity="0.59">0</tspan><tspan fill-opacity="0.63">0</tspan><tspan fill-opacity="0.66">0</tspan><tspan fill-opacity="0.70">0</tspan><tspan fill-opacity="0.73">1</tspan><tspan fill-opacity="0.77">1</tspan><tspan fill-opacity="0.80">0</tspan><tspan fill-opacity="0.84">0</tspan><tspan fill-opacity="0.88">1</tspan><tspan fill-opacity="0.92">0</tspan><tspan fill-opacity="0.96">0</tspan><tspan fill-opacity="1.00">0</tspan><tspan fill="#eafff0">▌</tspan></text>
</g>

<!-- chips -->
<g class="mono" font-size="16" font-weight="bold" letter-spacing="1">
  <g transform="translate(584,588)">
    <rect x="0" y="-25" width="100" height="36" rx="18" fill="#04140b" stroke="#1c6a3c" stroke-width="1.5"/>
    <text x="50" y="-1" text-anchor="middle" fill="#7dff8f">WOKWI</text>
    <rect x="114" y="-25" width="172" height="36" rx="18" fill="#04140b" stroke="#1c6a3c" stroke-width="1.5"/>
    <text x="200" y="-1" text-anchor="middle" fill="#7dff8f">30 FLIP-FLOPS</text>
    <rect x="300" y="-25" width="132" height="36" rx="18" fill="#04140b" stroke="#1c6a3c" stroke-width="1.5"/>
    <text x="366" y="-1" text-anchor="middle" fill="#7dff8f">SKY130 PDK</text>
    <text x="656" y="-1" text-anchor="end" fill="#6f8577" font-weight="normal">Ken Pettit</text>
  </g>
</g>
</svg>